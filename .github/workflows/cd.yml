name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app for production
        working-directory: frontend
        run: npm run build -- --configuration production --base-href "/STEAM-DevOpsLab/"

      - name: Detect deployment artifact folder
        run: |
          if [ -d frontend/dist/steam-dashboard/browser ]; then
            echo "DEPLOY_PATH=frontend/dist/steam-dashboard/browser" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PATH=frontend/dist/steam-dashboard" >> "$GITHUB_ENV"
          fi
          echo "Deploying from: ${DEPLOY_PATH}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
